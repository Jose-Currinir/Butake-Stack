name: macOS

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The same Xcode the app is developed with (27.2): Xcode 26 cannot type-check parts of the app.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Herramientas
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          # The toolchain of rust-toolchain.toml (version and components), the same as on every Mac.
          rustup toolchain install
          rustc --version
      - name: Calidad de Rust
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          cargo clippy --locked --all-targets --manifest-path engine/Cargo.toml -- -D warnings
      - name: Pruebas
        run: ./scripts/test-native.sh
      - name: Compilación y firma local
        run: |
          ./scripts/build-native.sh
          codesign --verify --deep --strict "build/native.noindex/Stack.app"
      - name: Espacios
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

  dependencies:
    # Known vulnerabilities (RustSec), licenses and sources of the engine's dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo audit
        run: |
          rustup toolchain install
          cargo install --locked --version 0.23.0 cargo-audit
          cargo audit --file engine/Cargo.lock
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: ./engine/Cargo.toml
          command: check
