[package]
name = "butake-stack"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync", "signal", "rt-multi-thread", "macros", "io-util"] }
anyhow = "1"
dirs = "6"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
